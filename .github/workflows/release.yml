name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check manifest version matches tag
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Package extension
        run: cd extension && zip -r "../youtube-in-page-fullscreen-$GITHUB_REF_NAME.zip" . -x '.*' '*/.*'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" youtube-in-page-fullscreen-*.zip --title "$GITHUB_REF_NAME" --generate-notes
