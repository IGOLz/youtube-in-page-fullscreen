name: Bug report
description: Something does not work on a YouTube page
labels: [bug]
body:
  - type: markdown
    attributes:
      value: YouTube changes its player often. The details below help reproduce the problem quickly.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: YouTube URL
      placeholder: https://www.youtube.com/watch?v=...
  - type: input
    id: extension
    attributes:
      label: Extension version
      description: Shown on brave://extensions or chrome://extensions.
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Brave 1.85 on macOS 27
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors or screenshots
      description: Optional. Open DevTools on the YouTube tab and copy any errors mentioning the extension.
