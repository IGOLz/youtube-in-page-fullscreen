<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Before and after: the video goes from the normal YouTube layout to filling the whole browser page</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2133"/><stop offset="1" stop-color="#11131d"/>
    </linearGradient>
    <linearGradient id="video" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a4c"/><stop offset=".55" stop-color="#ff4f6d"/><stop offset="1" stop-color="#e5267f"/>
    </linearGradient>
    <clipPath id="leftPage"><rect x="60" y="112" width="460" height="318" rx="4"/></clipPath>
    <clipPath id="rightPage"><rect x="680" y="112" width="460" height="318" rx="4"/></clipPath>
  </defs>

  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>

  <!-- Before -->
  <text x="290" y="58" fill="#9aa3c7" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="2">BEFORE</text>
  <rect x="48" y="72" width="484" height="370" rx="14" fill="#262b40" stroke="#3a4060"/>
  <circle cx="72" cy="92" r="5" fill="#ff5f57"/><circle cx="90" cy="92" r="5" fill="#febc2e"/><circle cx="108" cy="92" r="5" fill="#28c840"/>
  <rect x="132" y="84" width="280" height="16" rx="8" fill="#353b56"/>
  <g clip-path="url(#leftPage)">
    <rect x="60" y="112" width="460" height="318" fill="#f3f4f8"/>
    <rect x="60" y="112" width="460" height="30" fill="#ffffff"/>
    <rect x="72" y="122" width="54" height="10" rx="5" fill="#d5d8e3"/>
    <rect x="210" y="120" width="160" height="14" rx="7" fill="#e6e8f0"/>
    <circle cx="500" cy="127" r="7" fill="#d5d8e3"/>
    <rect x="72" y="154" width="292" height="164" rx="8" fill="url(#video)"/>
    <path d="M210 222v28l24-14z" fill="#fff"/>
    <rect x="72" y="330" width="230" height="12" rx="6" fill="#c9cdd9"/>
    <rect x="72" y="350" width="150" height="10" rx="5" fill="#dfe2ea"/>
    <rect x="72" y="376" width="292" height="40" rx="8" fill="#e7e9f0"/>
    <g fill="#dfe2ea">
      <rect x="378" y="154" width="64" height="38" rx="5"/><rect x="450" y="158" width="58" height="8" rx="4"/><rect x="450" y="172" width="40" height="7" rx="3.5"/>
      <rect x="378" y="202" width="64" height="38" rx="5"/><rect x="450" y="206" width="58" height="8" rx="4"/><rect x="450" y="220" width="40" height="7" rx="3.5"/>
      <rect x="378" y="250" width="64" height="38" rx="5"/><rect x="450" y="254" width="58" height="8" rx="4"/><rect x="450" y="268" width="40" height="7" rx="3.5"/>
      <rect x="378" y="298" width="64" height="38" rx="5"/><rect x="450" y="302" width="58" height="8" rx="4"/><rect x="450" y="316" width="40" height="7" rx="3.5"/>
      <rect x="378" y="346" width="64" height="38" rx="5"/><rect x="450" y="350" width="58" height="8" rx="4"/><rect x="450" y="364" width="40" height="7" rx="3.5"/>
    </g>
  </g>

  <!-- Key -->
  <rect x="566" y="214" width="68" height="68" rx="14" fill="#2c3250" stroke="#4a5280" stroke-width="2"/>
  <rect x="566" y="208" width="68" height="68" rx="14" fill="#353c5e" stroke="#5a6396" stroke-width="2"/>
  <text x="600" y="254" fill="#fff" font-size="30" font-weight="700" text-anchor="middle">F</text>
  <path d="M584 316h28m-9-9 9 9-9 9" fill="none" stroke="#ff6a63" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="358" fill="#9aa3c7" font-size="14" text-anchor="middle">or double-click</text>

  <!-- After -->
  <text x="910" y="58" fill="#9aa3c7" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="2">AFTER</text>
  <rect x="668" y="72" width="484" height="370" rx="14" fill="#262b40" stroke="#3a4060"/>
  <circle cx="692" cy="92" r="5" fill="#ff5f57"/><circle cx="710" cy="92" r="5" fill="#febc2e"/><circle cx="728" cy="92" r="5" fill="#28c840"/>
  <rect x="752" y="84" width="280" height="16" rx="8" fill="#353b56"/>
  <g clip-path="url(#rightPage)">
    <rect x="680" y="112" width="460" height="318" fill="url(#video)"/>
    <path d="M899 250v40l34-20z" fill="#fff"/>
    <rect x="680" y="380" width="460" height="50" fill="#000" opacity=".18"/>
    <rect x="696" y="394" width="428" height="4" rx="2" fill="#fff" opacity=".4"/>
    <rect x="696" y="394" width="170" height="4" rx="2" fill="#fff"/>
    <path d="M698 408v12l10-6z" fill="#fff"/>
    <rect x="1084" y="408" width="16" height="12" rx="2" fill="none" stroke="#fff" stroke-width="2"/>
  </g>

  <text x="600" y="488" fill="#c8cde6" font-size="17" text-anchor="middle">Same tab, no fullscreen animation. Header, recommendations and comments are hidden until you return.</text>
</svg>
